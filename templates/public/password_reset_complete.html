{% extends 'base.html' %}

{% block title %}Password Reset Successful — Legal Metrology{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="gov-card shadow-sm p-4 p-md-5 text-center">
        <i class="bi bi-shield-check text-success fs-1 mb-3"></i>
        <h2 class="h5 fw-bold text-dark mb-2">Password Successfully Updated</h2>
        <p class="small text-muted mb-4">
          Your credentials have been securely refreshed. You may now sign in to your dashboard.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-gov-primary btn-sm px-4">
          Sign In Now
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
