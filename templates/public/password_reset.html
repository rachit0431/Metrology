{% extends 'base.html' %}

{% block title %}Reset Password — Legal Metrology Online Verification{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="gov-card shadow-sm p-4 p-md-5">
        <div class="text-center mb-4">
          <i class="bi bi-key-fill fs-2 text-primary"></i>
          <h2 class="h5 fw-bold text-dark mt-2 mb-1">Password Assistance</h2>
          <p class="small text-muted mb-0">Enter your registered email address to receive password reset instructions.</p>
        </div>

        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label for="id_email" class="form-label">Registered Official Email</label>
            <input type="email" name="email" class="form-control" id="id_email" placeholder="name@domain.com" required>
          </div>
          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-gov-primary py-2">
              Send Password Reset Instructions
            </button>
          </div>
        </form>

        <div class="mt-4 pt-3 border-top text-center">
          <a href="{% url 'accounts:login' %}" class="small text-decoration-none">
            <i class="bi bi-arrow-left me-1"></i>Return to Sign In
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
